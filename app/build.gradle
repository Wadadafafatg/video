plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 34
    namespace "com.video"
        
    defaultConfig {
        applicationId "com.video"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // تفعيل ميزات Compose
    buildFeatures {
        compose true
    }

    composeOptions {
        // هذه النسخة متوافقة مع مكتبات Compose التي اخترتها
        kotlinCompilerExtensionVersion '1.5.11' 
    }
}

dependencies {
    // مكتبات Compose الأساسية
    implementation 'androidx.compose.ui:ui:1.6.3'
    implementation 'androidx.compose.material:material:1.6.3'       
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.6.3'

    // السطر الجديد المهم لظهور أيقونات (Home, Settings, Add)
    implementation 'androidx.compose.material:material-icons-extended:1.6.3'

    // مكتبات تشغيل الفيديو (Media3 ExoPlayer)
    implementation 'androidx.media3:media3-exoplayer:1.3.0'
    implementation 'androidx.media3:media3-ui:1.3.0'
    implementation 'androidx.media3:media3-common:1.3.0'

    // مكتبة عرض الصور المصغرة للفيديو
	// سطر إضافي لدعم تشغيل لقطات الفيديو في الصور
    implementation 'io.coil-kt:coil-video:2.6.0'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    
    // مكتبة التنقل بين الشاشات
    implementation 'androidx.navigation:navigation-compose:2.7.7'
}